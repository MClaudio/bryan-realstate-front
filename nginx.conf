server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # TAMAÑO MÁXIMO DE REQUEST (FIX PRINCIPAL para uploads > 1MB)
    # Por defecto Nginx limita client_max_body_size a 1MB.
    # Cualquier request > 1MB devolvía HTTP 413 Request Entity Too Large
    # sin siquiera llegar al backend → la UI se quedaba "pensando".
    # ============================================================
    client_max_body_size 50m;

    # Timeouts generosos para subidas lentas desde móviles/redes malas.
    # El backend NestJS ya tiene timeouts de 20-30min; Nginx NO debe
    # matar la conexión antes.
    client_body_timeout   600s;
    client_header_timeout 600s;
    send_timeout          600s;
    keepalive_timeout     600s;

    # Permitir transferencia chunked (streaming) sin buffering intermedio.
    chunked_transfer_encoding on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # ============================================================
    # Proxy al backend NestJS (API REST)
    # CLAVE para uploads grandes:
    # - proxy_request_buffering off → Nginx NO se guarda el body entero
    #   en /tmp, sino que hace STREAMING directo al backend. Sin esto
    #   Nginx esperaba a tener TODO el archivo antes de reenviarlo,
    #   provocando timeouts en archivos de varios MB.
    # - HTTP 1.1 necesario para streaming + keepalive correcto.
    # - Timeouts de proxy alineados con los del backend.
    # ============================================================
    location ^~ /api/ {
        proxy_pass http://bryan-backend:3000/api/;

        # Headers de forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Streaming: NO bufferrear la request → el body va directamente
        # del cliente a NestJS/Multer mientras llega (byte a byte).
        # Obligatorio para uploads multipart de archivos grandes.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;

        # Timeouts generosos (5 minutos). Si la subida a S3 tarda,
        # Nginx no desconecta al cliente esperando la respuesta de Nest.
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Manejar correctamente el header Expect: 100-continue
        # que envía Axios/HttpClient antes de subir cuerpos grandes.
        proxy_set_header Expect $http_expect;
    }

    # Proxy a archivos subidos servidos por NestJS (/uploads/)
    location ^~ /uploads/ {
        proxy_pass http://bryan-backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy a archivos públicos por ID (/public/files/{id} -> Nest)
    location ^~ /public/files/ {
        proxy_pass http://bryan-backend:3000/public/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cache para assets estáticos del frontend (excluye /api, /uploads y /public)
    location ~ ^/(?!api|uploads|public).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — todas las rutas van a index.html
    location / {
        try_files $uri /index.html;
    }

    # Seguridad básica
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
