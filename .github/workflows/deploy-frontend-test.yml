name: Build and Push Frontend (test branch)

on:
  push:
    branches:
      - test

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy test deployment (optional)
        env:
          DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_FRONTEND_TEST_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "EASYPANEL_DEPLOY_FRONTEND_TEST_WEBHOOK no está configurado, se omite este paso."
            exit 0
          fi
          echo "Triggering Dokploy TEST frontend deployment (pull image only, no build)..."
          body_file=$(mktemp)
          http_code=$(curl -s -o "$body_file" -D "$body_file.headers" -w "%{http_code}" -X POST "$DEPLOY_WEBHOOK")
          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "204" ]; then
            echo "Deployment webhook triggered successfully (HTTP $http_code)"
          else
            echo "Deployment webhook failed (HTTP $http_code)"
            if grep -qi '^cf-mitigated: challenge' "$body_file.headers"; then
              echo "::error::Cloudflare respondió con un challenge (bot protection) al runner de GitHub. Revisa el DNS del host del webhook de test (DNS only) o una regla de WAF para /api/deploy/*."
            fi
            head -c 300 "$body_file"; echo
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "Test image built and pushed:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ github.sha }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Author:  ${{ github.actor }}"
          echo "Time:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "Este workflow NO toca el servicio de producción (main)."
